[project]
name = "enterprise-ai-ready-data-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
default-groups = ["backend", "dev", "workspace"]

conflicts = [
    [
        { group = "jupyter-runtime" },
        { group = "backend" },
    ],
    [
        { group = "jupyter-runtime" },
        { group = "spark-runtime" },
    ],
    [
        { group = "jupyter-runtime" },
        { group = "minio-init" },
    ],
]

[dependency-groups]

# Python packages installed by the existing Spark Dockerfile.
spark-runtime = [
    "camelot-py>=2.0.0",
    "delta-spark==4.4.0",
    "minio==7.2.20",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
]

# Backend dependencies, including Spark and data-processing dependencies.
backend = [
    { include-group = "spark-runtime" },
    "alembic>=1.14,<2.0",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "psycopg[binary]>=3.2,<4.0",
    "pyarrow>=24.0.0",
    "pypdf>=6.19.0",
    "pyspark==4.2.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uuid6==2025.0.1",
    "uvicorn[standard]>=0.51.0",
]

# Dependencies used by the one-time MinIO initialization container.
minio-init = [
    "minio==7.2.20",
]

# Preserve the current Jupyter container's MinIO version.
jupyter-runtime = [
    "delta-spark==4.4.0",
    "jupyterlab==4.3.6",
    "minio==7.2.15",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyspark==4.2.0",
]

# Tools used in the local development environment.
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "pytest-asyncio>=1.3.0",
]

# JupyterLab for local workspace use; the container keeps its
# separate runtime group above.
workspace = [
    "jupyterlab==4.3.6",
]
